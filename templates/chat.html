<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakLegal Chat - Pakistan's Constitutional Law Assistant</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --pak-green: #01411C;
            --pak-light-green: #1B5E20;
            --pak-white: #FFFFFF;
            --pak-cream: #F5F5F5;
            --pak-green-light: #2E7D32;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--pak-cream);
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-container {
            display: flex;
            height: 100vh;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 300px;
            background: var(--pak-green);
            color: var(--pak-white);
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--pak-light-green);
        }
        
        .sidebar-header {
            padding: 20px;
            background: var(--pak-light-green);
            border-bottom: 2px solid var(--pak-green);
        }
        
        .sidebar-header h3 {
            margin: 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: var(--pak-green-light);
            color: var(--pak-white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .new-chat-btn:hover {
            background: var(--pak-light-green);
            transform: translateY(-2px);
        }
        
        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .chat-history-item {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
            word-break: break-word;
        }
        
        .chat-history-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-left-color: var(--pak-white);
        }
        
        .chat-history-item.active {
            background: rgba(255, 255, 255, 0.3);
            border-left-color: var(--pak-white);
        }
        
        /* Main Chat Area */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--pak-cream);
        }
        
        .chat-header {
            padding: 20px;
            background: var(--pak-green);
            color: var(--pak-white);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .chat-header h2 {
            margin: 0;
            font-size: 1.5rem;
        }
        
        .back-to-home {
            color: var(--pak-white);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 8px 12px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .back-to-home:hover {
            background: rgba(255, 255, 255, 0.2);
            color: var(--pak-white);
        }
        
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--pak-cream);
        }
        
        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message-bubble {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background: var(--pak-green);
            color: var(--pak-white);
        }
        
        .message.bot .message-bubble {
            background: var(--pak-white);
            color: #333;
            border: 1px solid #ddd;
        }
        
        .audio-player {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .audio-player audio {
            flex: 1;
            height: 30px;
            outline: none;
        }
        
        .audio-player audio::-webkit-media-controls-panel {
            background-color: #f0f0f0;
        }
        
        .message-time {
            font-size: 0.75rem;
            margin-top: 5px;
            opacity: 0.7;
        }
        
        /* Typing Indicator */
        .typing-indicator {
            display: none;
            margin-bottom: 15px;
        }
        
        .typing-indicator.active {
            display: block;
        }
        
        .typing-bubble {
            background: var(--pak-white);
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px 15px;
            width: fit-content;
        }
        
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typing 1.4s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }
        
        /* Chat Input */
        .chat-input-container {
            padding: 20px;
            background: var(--pak-cream);
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        #userInput {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }
        
        #userInput:focus {
            border-color: var(--pak-green);
            box-shadow: 0 0 5px rgba(1, 65, 28, 0.3);
        }
        
        #sendButton, #recordButton {
            padding: 10px;
            border: none;
            border-radius: 50%;
            background: var(--pak-green);
            color: var(--pak-white);
            cursor: pointer;
            font-size: 1.2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        #sendButton:hover, #recordButton:hover {
            background: var(--pak-light-green);
            transform: scale(1.05);
        }
        
        #recordButton.recording {
            background: #d32f2f;
            animation: pulse 0.6s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7);
            }
            50% {
                box-shadow: 0 0 0 8px rgba(211, 47, 47, 0);
            }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .message-bubble {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-balance-scale"></i> PakLegal</h3>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>
            <div class="chat-history" id="chatHistory"></div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-chat">
            <div class="chat-header">
                <h2><i class="fas fa-comments"></i> Constitutional Law Assistant</h2>
                <a href="/" class="back-to-home">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                <div class="message bot">
                    <div class="message-bubble">
                        <div>Assalam-o-Alaikum! I'm PakLegal, your AI assistant for Pakistan's Constitutional Law. How can I help you today?</div>
                        <div class="message-time" id="welcomeTime"></div>
                    </div>
                </div>
                
                <div class="typing-indicator" id="typingIndicator">
                    <div class="typing-bubble">
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="chat-input-container">
                <input type="text" id="userInput" placeholder="Type your message or hold to record...">
                <button id="recordButton" title="Hold to record"><i class="fas fa-microphone"></i></button>
                <button id="sendButton" title="Send message"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script>
        // DOM Elements
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const recordButton = document.getElementById('recordButton');
        const messagesContainer = document.getElementById('messagesContainer');
        const typingIndicator = document.getElementById('typingIndicator');
        const chatHistoryContainer = document.getElementById('chatHistory');
        
        // State
        let currentChatId = null;
        let chats = {};
        let mediaRecorder = null;
        let audioChunks = [];
        let isSending = false; // Prevent double sends
        let lastQueryWasVoice = false; // Track if last query was voice input

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadChatsFromStorage();
            document.getElementById('welcomeTime').textContent = getCurrentTime();
            startNewChat();
            
            // Event listeners
            sendButton.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });

            // Voice recording events
            recordButton.addEventListener('mousedown', startRecording);
            recordButton.addEventListener('mouseup', stopRecording);
            recordButton.addEventListener('touchstart', startRecording);
            recordButton.addEventListener('touchend', stopRecording);
        });

        // Voice Recording Functions
        function startRecording(e) {
            e.preventDefault();
            console.log('Start recording called');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                console.log('Already recording, ignoring');
                return;
            }
            
            audioChunks = []; // Reset audio chunks
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    console.log('Microphone access granted');
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = (event) => {
                        console.log('Data available, size:', event.data.size);
                        if (event.data.size > 0) {
                            audioChunks.push(event.data);
                        }
                    };
                    
                    mediaRecorder.onstart = () => {
                        console.log('Recording started');
                        recordButton.classList.add('recording');
                        recordButton.innerHTML = '<i class="fas fa-stop"></i>';
                    };
                    
                    mediaRecorder.start();
                })
                .catch(error => {
                    console.error('Error accessing microphone:', error);
                    alert('Unable to access microphone. Please check permissions.\n\nError: ' + error.message);
                });
        }

        function stopRecording(e) {
            e.preventDefault();
            console.log('Stop recording called, mediaRecorder state:', mediaRecorder ? mediaRecorder.state : 'null');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.onstop = () => {
                    console.log('Recording stopped, audio chunks:', audioChunks.length);
                    recordButton.classList.remove('recording');
                    recordButton.innerHTML = '<i class="fas fa-microphone"></i>';
                    
                    if (audioChunks.length > 0) {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        console.log('Audio blob created, size:', audioBlob.size);
                        sendAudioToServer(audioBlob);
                    } else {
                        console.log('No audio chunks recorded');
                        addMessage('bot', 'No audio recorded. Please try again.');
                    }
                };
                
                mediaRecorder.stop();
            }
        }

        async function sendAudioToServer(audioBlob) {
            console.log('Sending audio to server:', audioBlob);
            
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            
            showTypingIndicator();
            
            try {
                const csrfToken = getCookie('csrftoken');
                console.log('CSRF Token:', csrfToken);
                
                const response = await fetch('/transcribe/', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-CSRFToken': csrfToken
                    }
                });
                
                console.log('Transcription response status:', response.status);
                const data = await response.json();
                console.log('Transcription response:', data);
                
                hideTypingIndicator();
                
                if (data.transcript) {
                    lastQueryWasVoice = true; // Mark that this query came from voice
                    userInput.value = data.transcript;
                    sendMessage();
                } else if (data.error) {
                    addMessage('bot', 'Error: ' + data.error);
                } else {
                    addMessage('bot', 'Sorry, I could not understand the audio.');
                }
            } catch (error) {
                hideTypingIndicator();
                console.error('Error transcribing audio:', error);
                addMessage('bot', 'There was an error processing your voice input: ' + error.message);
            }
        }
        
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        
        // Message Functions
        async function sendMessage() {
            if (isSending) return; // Prevent double sends
            
            const message = userInput.value.trim();
            if (!message) return;
            
            isSending = true;
            addMessage('user', message);
            userInput.value = '';
            showTypingIndicator();
            
            try {
                const response = await fetch('/get/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: `msg=${encodeURIComponent(message)}`
                });
                
                const botResponse = await response.text();
                
                hideTypingIndicator();
                addMessage('bot', botResponse);
                
                // Only synthesize voice if the input was voice
                if (lastQueryWasVoice) {
                    playAudio(botResponse);
                    lastQueryWasVoice = false; // Reset flag
                }
                
            } catch (error) {
                hideTypingIndicator();
                console.error('Error:', error);
                addMessage('bot', 'Sorry, something went wrong.');
            } finally {
                isSending = false;
                saveCurrentChat();
            }
        }

        async function playAudio(text) {
            try {
                console.log('Requesting audio synthesis for:', text.substring(0, 50));
                const response = await fetch('/synthesize/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ text: text })
                });

                console.log('Synthesis response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Synthesis error response:', errorText);
                    throw new Error('Failed to synthesize speech: ' + response.status);
                }

                const audioBlob = await response.blob();
                console.log('Audio blob received, size:', audioBlob.size);
                
                const audioUrl = URL.createObjectURL(audioBlob);
                displayAudioPlayer(audioUrl);
                
            } catch (error) {
                console.error('Error playing audio:', error);
            }
        }
        
        function displayAudioPlayer(audioUrl) {
            // Find the last bot message
            const messages = messagesContainer.querySelectorAll('.message.bot');
            if (messages.length > 0) {
                const lastBotMessage = messages[messages.length - 1];
                const bubble = lastBotMessage.querySelector('.message-bubble');
                
                // Create audio player container
                const audioContainer = document.createElement('div');
                audioContainer.className = 'audio-player';
                
                const audio = document.createElement('audio');
                audio.controls = true;
                audio.src = audioUrl;
                
                audioContainer.appendChild(audio);
                bubble.appendChild(audioContainer);
                
                console.log('Audio player added to message');
            }
        }
        
        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            const contentDiv = document.createElement('div');
            if (type === 'bot') {
                contentDiv.innerHTML = marked.parse(content);
            } else {
                contentDiv.textContent = content;
            }
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            
            bubble.appendChild(contentDiv);
            bubble.appendChild(timeDiv);
            messageDiv.appendChild(bubble);
            
            messagesContainer.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
        }
        
        // UI Helper Functions
        function showTypingIndicator() {
            typingIndicator.classList.add('active');
            scrollToBottom();
        }
        
        function hideTypingIndicator() {
            typingIndicator.classList.remove('active');
        }
        
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        
        // Chat History and Storage Functions
        function generateChatId() {
            return `chat_${new Date().getTime()}_${Math.random().toString(36).substr(2, 9)}`;
        }
        
        function saveCurrentChat() {
            if (!currentChatId) return;
            
            const messages = [];
            const messageElements = messagesContainer.querySelectorAll('.message');
            messageElements.forEach(msg => {
                const bubble = msg.querySelector('.message-bubble');
                const content = bubble.querySelector('div:first-child');
                const time = bubble.querySelector('.message-time')?.textContent || '';
                
                messages.push({
                    type: msg.classList.contains('user') ? 'user' : 'bot',
                    content: content.textContent.trim(),
                    time: time
                });
            });
            
            const title = messages.find(m => m.type === 'user')?.content.substring(0, 50) || 'New Chat';
            
            chats[currentChatId] = {
                id: currentChatId,
                title: title,
                timestamp: new Date().toISOString(),
                messages: messages
            };
            
            localStorage.setItem('paklegal_chats', JSON.stringify(chats));
            loadChatHistory();
        }
        
        function loadChatsFromStorage() {
            const storedChats = localStorage.getItem('paklegal_chats');
            if (storedChats) {
                try {
                    chats = JSON.parse(storedChats);
                } catch (e) {
                    console.error('Error parsing chats:', e);
                    chats = {};
                }
            }
        }
        
        function loadChatHistory() {
            chatHistoryContainer.innerHTML = '';
            const sortedChats = Object.values(chats).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            sortedChats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'chat-history-item';
                if (chat.id === currentChatId) {
                    item.classList.add('active');
                }
                item.textContent = chat.title;
                item.onclick = () => loadChat(chat.id);
                chatHistoryContainer.appendChild(item);
            });
        }
        
        function loadChat(chatId) {
            if (!chats[chatId]) return;
            currentChatId = chatId;
            const chat = chats[chatId];
            
            messagesContainer.innerHTML = '';
            chat.messages.forEach(msg => {
                addMessage(msg.type, msg.content);
            });
            
            loadChatHistory();
        }
        
        function startNewChat() {
            currentChatId = generateChatId();
            messagesContainer.innerHTML = `<div class="message bot"><div class="message-bubble"><div>Assalam-o-Alaikum! I'm PakLegal, your AI assistant for Pakistan's Constitutional Law. How can I help you today?</div><div class="message-time">${getCurrentTime()}</div></div></div>`;
            messagesContainer.appendChild(typingIndicator);
            loadChatHistory();
        }
    </script>
</body>
</html>
